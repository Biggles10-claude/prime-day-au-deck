<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazon AU · Prime Big Deal Days 2026 · Deal board</title>
  <meta name="description" content="Interactive deal board for Amazon AU Prime Big Deal Days 2026 — buybox zip 3000 snapshot." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: rgba(0, 0, 0, 0.08);
      --accent: #c45c26;
      --ok: #2f7d4a;
      --warn: #a56a1a;
      --bad: #a33;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.55;
      font-size: 1.05rem;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(247, 246, 243, 0.94);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1.1rem 0.55rem;
    }
    .bar-inner {
      max-width: 72rem;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1rem;
      align-items: baseline;
      justify-content: space-between;
    }
    .bar h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .bar .meta {
      color: var(--muted);
      font-size: 0.82rem;
    }
    .kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .kpi {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .kpi strong { color: var(--ink); font-weight: 600; }
    .kpi.accent {
      background: rgba(196, 92, 38, 0.1);
      border-color: rgba(196, 92, 38, 0.25);
      color: var(--accent);
    }
    .kpi.accent strong { color: var(--accent); }
    .tabs-wrap {
      max-width: 72rem;
      margin: 0.55rem auto 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.35rem;
      padding-bottom: 0.15rem;
      min-width: min-content;
    }
    .tabs button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      white-space: nowrap;
    }
    .tabs button[aria-selected="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .tabs button .tab-count {
      opacity: 0.75;
      font-weight: 400;
      margin-left: 0.25rem;
    }
    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.25rem 1.1rem 3rem;
    }
    .filters {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      padding: 1rem;
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }
    .filter-row label.lbl {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 4.5rem;
    }
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .seg button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      min-height: 44px;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .seg button.new-chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
      gap: 0.65rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .field span {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input,
    .field select {
      font: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      background: var(--bg);
      color: var(--ink);
      min-height: 44px;
      width: 100%;
    }
    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(196, 92, 38, 0.35);
      outline-offset: 1px;
    }
    .count-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
      justify-content: space-between;
      margin: 0.25rem 0 1rem;
    }
    .count-bar strong { font-weight: 600; }
    .count-bar .hint { color: var(--muted); font-size: 0.88rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr));
      gap: 0.75rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.95rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }
    .card.is-new {
      border-color: rgba(196, 92, 38, 0.35);
      box-shadow: 0 0 0 1px rgba(196, 92, 38, 0.08);
    }
    .card .top {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.12rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg);
    }
    .badge.atl {
      color: var(--ok);
      border-color: rgba(47, 125, 74, 0.3);
      background: rgba(47, 125, 74, 0.08);
    }
    .badge.near {
      color: var(--warn);
      border-color: rgba(165, 106, 26, 0.3);
      background: rgba(165, 106, 26, 0.08);
    }
    .badge.real {
      color: var(--accent);
      border-color: rgba(196, 92, 38, 0.25);
      background: rgba(196, 92, 38, 0.08);
    }
    .badge.oos {
      color: var(--bad);
      border-color: rgba(170, 51, 51, 0.3);
      background: rgba(170, 51, 51, 0.08);
    }
    .badge.excl { color: var(--muted); }
    .badge.new {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .card .title {
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .card .price-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.65rem;
      align-items: baseline;
    }
    .card .sale {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.15rem;
    }
    .card .rrp {
      color: var(--muted);
      font-size: 0.88rem;
      text-decoration: line-through;
    }
    .card .pct {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ok);
    }
    .card .meta-line {
      color: var(--muted);
      font-size: 0.82rem;
      overflow-wrap: anywhere;
    }
    .card .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: auto;
      padding-top: 0.35rem;
    }
    .card .links a {
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .card .links a:hover { text-decoration: underline; }
    .empty {
      grid-column: 1 / -1;
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    footer {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1.1rem 3rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer h2 {
      font-size: 0.95rem;
      color: var(--ink);
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    footer ul {
      margin: 0 0 1rem;
      padding-left: 1.15rem;
    }
    footer li { margin: 0.25rem 0; }
    footer a { color: var(--accent); }
    @media (max-width: 480px) {
      .bar h1 { font-size: 0.95rem; }
      .grid { grid-template-columns: 1fr; }
      .filter-row label.lbl { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div>
        <h1 id="event-title">Amazon AU Prime Big Deal Days 2026</h1>
        <div class="meta" id="event-meta">Loading snapshot…</div>
      </div>
      <div class="kpis" id="kpis" aria-label="Snapshot KPIs"></div>
    </div>
    <div class="tabs-wrap">
      <div class="tabs" role="tablist" aria-label="Prime run" id="round-tabs"></div>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Deal filters">
      <div class="filter-row">
        <label class="lbl">Status</label>
        <div class="seg" role="group" aria-label="Status filter" id="status-seg">
          <button type="button" data-status="include" aria-pressed="true">Include</button>
          <button type="button" data-status="exclude" aria-pressed="false">Exclude</button>
          <button type="button" data-status="oos" aria-pressed="false">OOS</button>
          <button type="button" data-status="all" aria-pressed="false">All</button>
        </div>
      </div>
      <div class="filter-row">
        <label class="lbl">Added</label>
        <div class="seg" role="group" aria-label="New includes filter" id="new-seg">
          <button type="button" data-new="all" aria-pressed="true">All deals</button>
          <button type="button" class="new-chip" data-new="new" aria-pressed="false" id="new-only-btn">New only</button>
        </div>
      </div>
      <div class="filter-row">
        <label class="lbl">Verdict</label>
        <div class="seg" role="group" aria-label="Verdict filter" id="verdict-seg">
          <button type="button" data-verdict="all" aria-pressed="true">All</button>
          <button type="button" data-verdict="ATL" aria-pressed="false">ATL</button>
          <button type="button" data-verdict="near-ATL" aria-pressed="false">Near-ATL</button>
          <button type="button" data-verdict="real-discount" aria-pressed="false">Real discount</button>
          <button type="button" data-verdict="insufficient-history" aria-pressed="false">Insufficient hist.</button>
        </div>
      </div>
      <div class="filter-row">
        <label class="lbl" id="category-lbl">Category</label>
        <div class="seg" role="group" aria-labelledby="category-lbl" id="category-seg"></div>
      </div>
      <div class="filter-row">
        <label class="lbl" id="sort-lbl">Sort</label>
        <div class="seg" role="group" aria-labelledby="sort-lbl" id="sort-seg">
          <button type="button" data-sort="default" aria-pressed="true">Default (current snapshot order)</button>
          <button type="button" data-sort="price-asc" aria-pressed="false">Price: low to high</button>
          <button type="button" data-sort="price-desc" aria-pressed="false">Price: high to low</button>
          <button type="button" data-sort="discount-desc" aria-pressed="false">Discount $: largest first</button>
          <button type="button" data-sort="pct-desc" aria-pressed="false">Percent off: largest first</button>
          <button type="button" data-sort="category" aria-pressed="false">Category A–Z</button>
        </div>
      </div>
      <div class="controls">
        <label class="field">
          <span>Max price (AUD)</span>
          <input type="number" id="max-price" min="0" step="1" placeholder="Any" inputmode="decimal" />
        </label>
        <label class="field" style="grid-column: span 1 / auto;">
          <span>Search</span>
          <input type="search" id="search" placeholder="Title, ASIN, seller…" autocomplete="off" />
        </label>
      </div>
    </section>

    <div class="count-bar">
      <div><strong id="visible-count">0</strong> <span class="hint" id="count-label">deals shown</span></div>
      <div class="hint" id="filter-hint">Default: Include only · use New only for this round’s additions</div>
    </div>

    <section class="grid" id="grid" aria-live="polite" aria-busy="true"></section>
  </main>

  <footer>
    <h2>Caveats</h2>
    <ul id="caveats"></ul>
    <p id="footer-meta"></p>
  </footer>

  <script src="assets/data.js"></script>
  <script>
    (function () {
      const root = window.PRIME_DEALS;
      if (!root || (!Array.isArray(root.items) && !root.rounds)) {
        document.getElementById("grid").innerHTML =
          '<div class="empty">Failed to load deal data.</div>';
        return;
      }

      const roundsMap = root.rounds || {};
      const roundList =
        (root.meta && root.meta.rounds) ||
        Object.keys(roundsMap).map(function (id) {
          const m = (roundsMap[id] && roundsMap[id].meta) || {};
          return {
            id: id,
            label: m.label || id,
            include_count: m.include_count,
            new_includes: m.new_includes,
            snapshot_awst: m.snapshot_awst,
          };
        });

      let activeRound =
        (root.meta && root.meta.default_round) ||
        (roundList.length ? roundList[roundList.length - 1].id : null);
      if (activeRound === "all" && roundList.length > 1) {
        // prefer last concrete round as default if listed
        const concrete = roundList.filter(function (r) { return r.id !== "all"; });
        if (concrete.length) activeRound = concrete[concrete.length - 1].id;
      }

      let meta = root.meta || {};
      let items = root.items || [];

      function loadRound(id) {
        activeRound = id;
        if (roundsMap[id]) {
          meta = roundsMap[id].meta || meta;
          items = roundsMap[id].items || [];
        } else if (id === (root.meta && root.meta.default_round)) {
          meta = root.meta;
          items = root.items || [];
        }
        paintChrome();
        rebuildCategories();
        render();
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      const tabsEl = document.getElementById("round-tabs");
      function paintTabs() {
        tabsEl.innerHTML = roundList
          .map(function (r) {
            const sel = r.id === activeRound ? "true" : "false";
            const count =
              typeof r.include_count === "number"
                ? '<span class="tab-count">' + r.include_count + "</span>"
                : "";
            return (
              '<button type="button" role="tab" data-round="' +
              escapeAttr(r.id) +
              '" aria-selected="' +
              sel +
              '">' +
              escapeHtml(r.label || r.id) +
              count +
              "</button>"
            );
          })
          .join("");
        tabsEl.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            loadRound(btn.getAttribute("data-round"));
          });
        });
      }

      function paintChrome() {
        document.getElementById("event-title").textContent =
          meta.event || "Amazon AU Prime Big Deal Days 2026";
        const snap = meta.snapshot_awst || "";
        const snapLabel = snap.replace("T", " ").replace("+08:00", " AWST");
        document.getElementById("event-meta").textContent =
          (meta.window || "") +
          " · " +
          (meta.label || activeRound || "") +
          " · snapshot " +
          snapLabel +
          " · buybox zip " +
          (meta.postcode || "3000");

        const kpis = document.getElementById("kpis");
        const kpiBits = [
          ["Includes", meta.include_count, true],
          ["New this round", meta.new_includes, true],
          ["Candidates", meta.candidates, false],
          ["Buybox OK", meta.buybox_ok, false],
          ["OOS", meta.oos_count, false],
          ["Excludes", meta.exclude_count, false],
        ];
        kpis.innerHTML = kpiBits
          .map(function (row) {
            if (row[1] == null) return "";
            return (
              '<span class="kpi' +
              (row[2] ? " accent" : "") +
              '"><strong>' +
              row[1] +
              "</strong> " +
              row[0] +
              "</span>"
            );
          })
          .join("");

        const caveats = document.getElementById("caveats");
        caveats.innerHTML = "";
        (meta.caveats || []).forEach(function (c) {
          const li = document.createElement("li");
          li.textContent = c;
          caveats.appendChild(li);
        });
        const v = meta.verdicts || {};
        document.getElementById("footer-meta").innerHTML =
          "Include verdicts: ATL " +
          (v.ATL || 0) +
          " · near-ATL " +
          (v["near-ATL"] || 0) +
          " · real-discount " +
          ((v["real-discount"] || 0) + (v["real-discount-not-ATL"] || 0)) +
          " · insufficient-history " +
          (v["insufficient-history"] || 0) +
          ". New includes vs prior run: " +
          (meta.new_includes || 0) +
          ". Fail (no buyable parse): " +
          (meta.fail_count || 0) +
          ". Data from local scan JSON — not live-scraped in-browser. " +
          (meta.buybox_tool
            ? "Buybox tool: " + escapeHtml(meta.buybox_tool) + "."
            : "");
        paintTabs();
      }

      const catSeg = document.getElementById("category-seg");
      let category = "all";
      function rebuildCategories() {
        const counts = new Map();
        items.forEach(function (i) {
          const c = i.category || "Other";
          counts.set(c, (counts.get(c) || 0) + 1);
        });
        const cats = Array.from(counts.keys()).sort(function (a, b) {
          if (a === "Other") return 1;
          if (b === "Other") return -1;
          return a.localeCompare(b);
        });
        if (category !== "all" && !counts.has(category)) category = "all";
        const allPressed = category === "all" ? "true" : "false";
        catSeg.innerHTML =
          '<button type="button" data-cat="all" aria-pressed="' +
          allPressed +
          '">All categories (' +
          items.length +
          ")</button>" +
          cats
            .map(function (c) {
              return (
                '<button type="button" data-cat="' +
                escapeAttr(c) +
                '" aria-pressed="' +
                (category === c ? "true" : "false") +
                '">' +
                escapeHtml(c) +
                " (" +
                counts.get(c) +
                ")</button>"
              );
            })
            .join("");
        catSeg.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            category = btn.getAttribute("data-cat");
            catSeg.querySelectorAll("button").forEach(function (b) {
              b.setAttribute("aria-pressed", String(b === btn));
            });
            render();
          });
        });
      }

      let status = "include";
      let verdict = "all";
      let newMode = "all";

      const statusBtns = document.querySelectorAll("#status-seg button");
      const verdictBtns = document.querySelectorAll("#verdict-seg button");
      const newBtns = document.querySelectorAll("#new-seg button");
      const maxPriceEl = document.getElementById("max-price");
      const searchEl = document.getElementById("search");
      const grid = document.getElementById("grid");
      const visibleCount = document.getElementById("visible-count");
      const countLabel = document.getElementById("count-label");
      const filterHint = document.getElementById("filter-hint");

      statusBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          status = btn.getAttribute("data-status");
          statusBtns.forEach(function (b) {
            b.setAttribute("aria-pressed", String(b === btn));
          });
          render();
        });
      });
      verdictBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          verdict = btn.getAttribute("data-verdict");
          verdictBtns.forEach(function (b) {
            b.setAttribute("aria-pressed", String(b === btn));
          });
          render();
        });
      });
      newBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          newMode = btn.getAttribute("data-new");
          newBtns.forEach(function (b) {
            b.setAttribute("aria-pressed", String(b === btn));
          });
          render();
        });
      });
      const sortBtns = document.querySelectorAll("#sort-seg button");
      let sortMode = "default";
      sortBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          sortMode = btn.getAttribute("data-sort") || "default";
          sortBtns.forEach(function (b) {
            b.setAttribute("aria-pressed", String(b === btn));
          });
          render();
        });
      });
      maxPriceEl.addEventListener("input", render);
      searchEl.addEventListener("input", render);

      function money(n) {
        if (typeof n !== "number" || !isFinite(n)) return "—";
        return (
          "$" +
          n.toLocaleString("en-AU", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      // Map filter/display buckets. Keep ATL / near-ATL / insufficient-history separate.
      // Round data uses real-discount-not-ATL for non-ATL real discounts.
      function normalizeVerdict(v) {
        if (v === "real-discount-not-ATL") return "real-discount";
        return v;
      }

      function verdictBadge(v, st) {
        if (st === "oos") return '<span class="badge oos">OOS</span>';
        if (st === "exclude") return '<span class="badge excl">Exclude</span>';
        const nv = normalizeVerdict(v);
        if (nv === "ATL") return '<span class="badge atl">ATL</span>';
        if (nv === "near-ATL") return '<span class="badge near">Near-ATL</span>';
        if (nv === "real-discount")
          return '<span class="badge real">Real discount</span>';
        if (nv === "insufficient-history")
          return '<span class="badge">Insufficient history</span>';
        if (v) return '<span class="badge">' + escapeHtml(v) + "</span>";
        return "";
      }

      function matches(item) {
        if (status !== "all" && item.status !== status) return false;
        if (newMode === "new" && !item.is_new) return false;
        if (verdict !== "all" && normalizeVerdict(item.verdict) !== verdict) return false;
        if (category !== "all" && (item.category || "Other") !== category) return false;
        const maxP = parseFloat(maxPriceEl.value);
        if (!isNaN(maxP) && maxP >= 0) {
          if (typeof item.sale !== "number" || item.sale > maxP) return false;
        }
        const q = (searchEl.value || "").trim().toLowerCase();
        if (q) {
          const hay = (
            (item.title || "") +
            " " +
            (item.asin || "") +
            " " +
            (item.seller || "") +
            " " +
            (item.category || "")
          ).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      }

      function cardHtml(item) {
        const badge = verdictBadge(item.verdict, item.status);
        const newBadge = item.is_new
          ? '<span class="badge new">New</span>'
          : "";
        const cat = item.category
          ? '<span class="badge">' + escapeHtml(item.category) + "</span>"
          : "";
        const rrp =
          typeof item.rrp === "number" &&
          typeof item.sale === "number" &&
          item.rrp > item.sale
            ? '<span class="rrp">was ' + money(item.rrp) + "</span>"
            : "";
        const pct =
          typeof item.pct === "number"
            ? '<span class="pct">' + item.pct + "% off</span>"
            : "";
        const seller = item.seller
          ? '<div class="meta-line">' + escapeHtml(item.seller) + "</div>"
          : "";
        const asin = item.asin
          ? '<div class="meta-line">' + escapeHtml(item.asin) + "</div>"
          : "";
        const seen = item.first_seen_awst
          ? '<div class="meta-line">First seen ' +
            escapeHtml(
              String(item.first_seen_awst)
                .replace("T", " ")
                .replace("+08:00", " AWST")
            ) +
            "</div>"
          : "";
        const camel = item.camel
          ? '<a href="' +
            escapeAttr(item.camel) +
            '" target="_blank" rel="noopener noreferrer">Camel</a>'
          : "";
        const url =
          item.url || "https://www.amazon.com.au/dp/" + (item.asin || "");
        return (
          '<article class="card' +
          (item.is_new ? " is-new" : "") +
          '">' +
          '<div class="top">' +
          newBadge +
          badge +
          cat +
          "</div>" +
          '<div class="title">' +
          escapeHtml(item.title || item.asin || "") +
          "</div>" +
          '<div class="price-row">' +
          '<span class="sale">' +
          money(item.sale) +
          " AUD</span>" +
          rrp +
          pct +
          "</div>" +
          seller +
          asin +
          seen +
          '<div class="links">' +
          '<a href="' +
          escapeAttr(url) +
          '" target="_blank" rel="noopener noreferrer">Amazon AU</a>' +
          camel +
          "</div>" +
          "</article>"
        );
      }

      function finiteNumber(n) {
        return typeof n === "number" && isFinite(n) ? n : null;
      }
      function discountDollars(item) {
        const rrp = finiteNumber(item.rrp);
        const sale = finiteNumber(item.sale);
        if (rrp == null || sale == null || !(rrp > sale)) return null;
        return rrp - sale;
      }
      function sortLabel() {
        if (sortMode === "price-asc") return "Price: low to high";
        if (sortMode === "price-desc") return "Price: high to low";
        if (sortMode === "discount-desc") return "Discount $: largest first";
        if (sortMode === "pct-desc") return "Percent off: largest first";
        if (sortMode === "category") return "Category A–Z";
        return "Default (current snapshot order)";
      }
      function sortedMatched(pairs) {
        if (sortMode === "default") {
          return pairs.map(function (p) { return p.item; });
        }
        const copy = pairs.slice();
        const desc =
          sortMode === "price-desc" ||
          sortMode === "discount-desc" ||
          sortMode === "pct-desc";
        copy.sort(function (a, b) {
          if (sortMode === "category") {
            const ca = a.item.category || "Other";
            const cb = b.item.category || "Other";
            if (ca !== cb) {
              if (ca === "Other") return 1;
              if (cb === "Other") return -1;
              const c = ca.localeCompare(cb);
              if (c !== 0) return c;
            }
            return a.idx - b.idx;
          }
          let ka = null;
          let kb = null;
          if (sortMode === "price-asc" || sortMode === "price-desc") {
            ka = finiteNumber(a.item.sale);
            kb = finiteNumber(b.item.sale);
          } else if (sortMode === "discount-desc") {
            ka = discountDollars(a.item);
            kb = discountDollars(b.item);
          } else if (sortMode === "pct-desc") {
            ka = finiteNumber(a.item.pct);
            kb = finiteNumber(b.item.pct);
          }
          if (ka == null && kb == null) return a.idx - b.idx;
          if (ka == null) return 1;
          if (kb == null) return -1;
          if (ka !== kb) return desc ? kb - ka : ka - kb;
          return a.idx - b.idx;
        });
        return copy.map(function (p) { return p.item; });
      }

      function render() {
        const pairs = [];
        for (let i = 0; i < items.length; i++) {
          if (matches(items[i])) pairs.push({ item: items[i], idx: i });
        }
        const matched = sortedMatched(pairs);
        visibleCount.textContent = String(matched.length);
        const bucket =
          status === "all"
            ? "all statuses"
            : status === "include"
            ? "includes"
            : status === "exclude"
            ? "excludes"
            : "OOS";
        const newBit = newMode === "new" ? " · new only" : "";
        countLabel.textContent =
          "showing · " +
          bucket +
          newBit +
          " (of " +
          items.length +
          " in this tab)";
        const filtersDefault =
          status === "include" &&
          newMode === "all" &&
          verdict === "all" &&
          category === "all" &&
          !maxPriceEl.value &&
          !(searchEl.value || "").trim();
        const sortBit =
          sortMode === "default" ? "" : " · sorted by " + sortLabel();
        filterHint.textContent =
          filtersDefault && sortMode === "default"
            ? "Default: Include only (" +
              (meta.include_count || 0) +
              ") · " +
              (meta.new_includes || 0) +
              " new vs prior run — tap New only"
            : newMode === "new"
            ? "New only: includes added this round vs prior board (" +
              (meta.new_includes || 0) +
              ")" +
              sortBit
            : filtersDefault
            ? "Sorted by " + sortLabel()
            : "Filters active" + sortBit;

        if (!matched.length) {
          grid.innerHTML =
            '<div class="empty">No deals match these filters.</div>';
        } else {
          const CHUNK = 120;
          let i = 0;
          grid.innerHTML = "";
          function paint() {
            const end = Math.min(i + CHUNK, matched.length);
            const frag = document.createDocumentFragment();
            const wrap = document.createElement("div");
            wrap.innerHTML = matched.slice(i, end).map(cardHtml).join("");
            while (wrap.firstChild) frag.appendChild(wrap.firstChild);
            grid.appendChild(frag);
            i = end;
            if (i < matched.length) {
              requestAnimationFrame(paint);
            } else {
              grid.setAttribute("aria-busy", "false");
            }
          }
          grid.setAttribute("aria-busy", "true");
          paint();
        }
      }

      // Init from active round
      if (roundsMap[activeRound]) {
        meta = roundsMap[activeRound].meta || meta;
        items = roundsMap[activeRound].items || items;
      }
      paintChrome();
      rebuildCategories();
      render();
    })();
  </script>
</body>
</html>
